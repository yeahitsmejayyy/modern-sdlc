name: Deploy

# Every push to main: test → build images → deploy to the VPS → check it's live.
# Run it by hand with a tag (a full commit SHA) to redeploy an older build: that's a rollback.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Full commit SHA of an earlier build to redeploy (leave empty to build this commit)
        required: false

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/yeahitsmejayyy/modern-sdlc
  TAG: ${{ inputs.tag || github.sha }}

jobs:
  ci:
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server
        uses: docker/build-push-action@v7
        with:
          context: apps/server
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-server:${{ github.sha }},${{ env.IMAGE_PREFIX }}-server:latest
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }},${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    # Also runs when build was skipped because a tag was given, but never after a failure.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Copy compose.yaml to the server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: compose.yaml
          target: /opt/modern-sdlc
      - name: Pull the new images and restart
        uses: appleboy/ssh-action@v1
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG,DOMAIN,POSTGRES_PASSWORD,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/modern-sdlc

            # The server's config. Only the deploy user can read it.
            umask 077
            printf 'TAG=%s\nDOMAIN=%s\nPOSTGRES_PASSWORD=%s\n' "$TAG" "$DOMAIN" "$POSTGRES_PASSWORD" > .env
            chmod 600 .env

            # This job's token can read the images (even private ones) and expires when the job ends.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker logout ghcr.io

            docker compose up -d --remove-orphans
            docker image prune -f

  verify:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check /health reports this commit and a working database
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          want="${TAG:0:7}"
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 5 "https://$DOMAIN/health" || true)
            echo "attempt $attempt: $body"
            if echo "$body" | jq -e --arg c "$want" '.db == true and .commit == $c' > /dev/null; then
              echo "Live on https://$DOMAIN at commit $want"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$DOMAIN/health never reported commit $want with db: true"
          exit 1
