name: Deploy

# Every push: test → build images → deploy → check it's live.
#   main         → production  (https://sdlc.itspjbell.com)
#   other branch → staging     (https://sdlc-staging.itspjbell.com)
# Run it by hand with a tag (a full commit SHA) to redeploy an older build: that's a rollback.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [production, staging]
        default: production
      tag:
        description: Full commit SHA of an earlier build to redeploy (leave empty to build this commit)
        required: false

permissions:
  contents: read

# One deploy per environment at a time, and never cancel one halfway through.
# A staging deploy never waits for a production one, or the other way round.
concurrency:
  group: deploy-${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/yeahitsmejayyy/modern-sdlc
  TAG: ${{ inputs.tag || github.sha }}

jobs:
  ci:
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Every build gets its SHA tag; only main moves `latest`.
      LATEST: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server
        uses: docker/build-push-action@v7
        with:
          context: apps/server
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-server:${{ github.sha }}
            ${{ env.LATEST == 'true' && format('{0}-server:latest', env.IMAGE_PREFIX) || '' }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
            ${{ env.LATEST == 'true' && format('{0}-web:latest', env.IMAGE_PREFIX) || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    # Also runs when build was skipped because a tag was given, but never after a failure.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # The environment holds DOMAIN and POSTGRES_PASSWORD. GitHub only lets main
    # deploy to production, whatever this file says.
    environment: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    permissions:
      contents: read
      packages: read
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      domain: ${{ vars.DOMAIN }}
    steps:
      - name: Pick the stack on the server
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            dir=/opt/modern-sdlc;         project=modern-sdlc;         files=compose.yaml
          else
            dir=/opt/modern-sdlc-staging; project=modern-sdlc-staging; files=compose.yaml:compose.staging.yaml
          fi
          printf 'environment=%s\napp_dir=%s\nproject=%s\ncompose_file=%s\n' \
            "$ENVIRONMENT" "$dir" "$project" "$files" >> "$GITHUB_OUTPUT"
      - name: Refuse to deploy without a login password
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
        run: |
          # Without it nobody could log in; never ship an environment like that.
          if [ -z "$APP_PASSWORD" ]; then
            echo "::error::APP_PASSWORD isn't set for $ENVIRONMENT. Set it with: gh secret set APP_PASSWORD --env $ENVIRONMENT"
            exit 1
          fi
          # .env wraps it in single quotes so $, # and spaces stay literal; a quote would end it early.
          case "$APP_PASSWORD" in *"'"*)
            echo "::error::APP_PASSWORD for $ENVIRONMENT can't contain a single quote (')."
            exit 1;;
          esac
      - uses: actions/checkout@v7
      - name: Copy the compose files to the server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: compose.yaml,compose.staging.yaml
          target: ${{ steps.target.outputs.app_dir }}
      - name: Pull the new images and restart
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ steps.target.outputs.app_dir }}
          COMPOSE_PROJECT_NAME: ${{ steps.target.outputs.project }}
          COMPOSE_FILE: ${{ steps.target.outputs.compose_file }}
          DOMAIN: ${{ vars.DOMAIN }}
          # Only production has it: production's Caddy is the front door for staging too.
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR,COMPOSE_PROJECT_NAME,COMPOSE_FILE,TAG,DOMAIN,STAGING_DOMAIN,POSTGRES_PASSWORD,APP_PASSWORD,API_TOKEN,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$APP_DIR"

            # The stack's config. Only the deploy user can read it. COMPOSE_PROJECT_NAME and
            # COMPOSE_FILE make plain `docker compose ...` in this folder target this stack.
            umask 077
            {
              echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME"
              echo "COMPOSE_FILE=$COMPOSE_FILE"
              echo "TAG=$TAG"
              echo "DOMAIN=$DOMAIN"
              echo "STAGING_DOMAIN=$STAGING_DOMAIN"
              echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
              # Single-quoted: compose reads these literally, with no $ interpolation.
              echo "APP_PASSWORD='$APP_PASSWORD'"
              echo "API_TOKEN='$API_TOKEN'"
            } > .env
            chmod 600 .env

            # This job's token can read the images (even private ones) and expires when the job ends.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker logout ghcr.io

            docker compose up -d --remove-orphans
            docker image prune -f

  verify:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    # "verify (staging)" is a required check on main: a PR can't merge until its
    # exact commit is live and healthy on staging.
    name: verify (${{ needs.deploy.outputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Check /health reports this commit and a working database
        env:
          DOMAIN: ${{ needs.deploy.outputs.domain }}
        run: |
          want="${TAG:0:7}"
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 5 "https://$DOMAIN/health" || true)
            echo "attempt $attempt: $body"
            if echo "$body" | jq -e --arg c "$want" '.db == true and .commit == $c' > /dev/null; then
              echo "Live on https://$DOMAIN at commit $want"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$DOMAIN/health never reported commit $want with db: true"
          exit 1
