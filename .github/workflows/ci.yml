name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # deploy.yml runs this same workflow before it builds anything

permissions:
  contents: read

# A newer push to the same branch cancels the run that's still going.
# When called from deploy.yml, github.workflow is the caller's name, so the two never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    # A real Postgres that exists only for this job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_DB: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact versions only (no floating v10 tag).
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      - name: Test
        run: uv run pytest
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/app
