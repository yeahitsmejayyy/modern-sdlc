services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only: the database is never reachable from outside the machine.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    image: ghcr.io/yeahitsmejayyy/modern-sdlc-server:${TAG:-latest}
    build: ./apps/server
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@db:5432/app
      # Empty unless set: login (or agent access) stays off rather than using a default.
      APP_PASSWORD: ${APP_PASSWORD:-}
      API_TOKEN: ${API_TOKEN:-}
      # The voice agent (Edith). Empty means the agent widget can't start conversations.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      AGENT_HOURLY_CAP: ${AGENT_HOURLY_CAP:-}
      AGENT_DAILY_CAP: ${AGENT_DAILY_CAP:-}
    # No published ports: only web can reach it, over the compose network.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: ghcr.io/yeahitsmejayyy/modern-sdlc-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy's own default only kicks in when DOMAIN is unset, not empty, so fall back here.
      DOMAIN: ${DOMAIN:-:80}
      # Same trap: an empty site address breaks the Caddyfile. Locally this is a harmless
      # plain-HTTP placeholder; production sets the real staging domain.
      STAGING_DOMAIN: ${STAGING_DOMAIN:-http://staging.localhost}
    networks:
      default:
      edge: # shared with the staging stack's web, so this Caddy can reach it
    volumes:
      - caddy_data:/data # HTTPS certificates live here; keep them across deploys
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge:
    name: edge # a fixed name (not prefixed by the project) so the staging project can join it

volumes:
  pgdata:
  caddy_data:
  caddy_config:
